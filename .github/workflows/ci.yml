name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: ./.github/actions/cache_cargo
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Test documentation
        run: cargo test --locked --workspace --doc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WebAssembly package
        run: node scripts/build-wasm.cjs
        working-directory: motrs_wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: motrs_wasm/pkg/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motrs_wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: motrs_wasm/package.json
          cache: true
          cache_dependency_path: motrs_wasm/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: wasm-package
          path: motrs_wasm/pkg/
      - name: Install browser dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit browser dependencies
        run: pnpm audit
      - name: Build browser example
        run: pnpm run build:browser
